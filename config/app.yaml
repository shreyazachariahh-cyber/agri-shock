app:
  name: agri-shock
  environment: development
  timezone: UTC

streaming:
  shock_lookahead_days: null  # Set only after Phase 2/3 source-lateness analysis.
  watermark_hours: null       # Set from observed lateness, never guessed.
  market_dimension_path: null # Versioned canonical market reference, not a hardcoded region.
  district_boundary_path: null # Versioned GeoJSON/Delta boundary reference.

sources:
  data_gov_in:
    enabled: false
  imd:
    enabled: false
  gdacs:
    enabled: false

kafka:
  topics:
    mandi_prices: mandi-prices
    weather_events: weather-events
    flood_events: flood-events
    market_shock_signals: market-shock-signals
    dead_letter_events: dead-letter-events
  retry:
    max_attempts: 3
    initial_backoff_seconds: 1

# The analytical policy is deliberately explicit rather than inferred from a
# single event. These provisional values are configuration, not causal claims;
# calibrate them only after a documented evaluation set exists.
signal:
  max_shock_severity: 20
  max_price_decline: 30
  max_robust_abnormality: 20
  max_temporal_proximity: 10
  max_control_difference: 20
  lookahead_days: 14
  high_threshold: 70
  medium_threshold: 40
