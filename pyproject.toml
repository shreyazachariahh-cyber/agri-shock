[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-shock"
version = "0.1.0"
description = "Event-time agricultural price shock and potential distress-signal platform"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
streaming = [
    "pyspark==3.5.6",
    "delta-spark==3.2.1",
    "confluent-kafka==2.9.0",
    "elasticsearch==8.15.1",
    "apache-sedona==1.9.0",
    "pandas>=2.0,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
