app:
  name: agri-shock
  environment: development
  timezone: UTC

streaming:
  shock_lookahead_days: null  # Set only after Phase 2/3 source-lateness analysis.
  watermark_hours: null       # Set from observed lateness, never guessed.

sources:
  data_gov_in:
    enabled: false
  imd:
    enabled: false
  gdacs:
    enabled: false

kafka:
  topics:
    mandi_prices: mandi-prices
    weather_events: weather-events
    flood_events: flood-events
    distress_alerts: distress-alerts
    dead_letter_events: dead-letter-events
  retry:
    max_attempts: 3
    initial_backoff_seconds: 1
